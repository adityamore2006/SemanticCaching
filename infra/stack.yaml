AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Semantic cache: one small instance plus the DynamoDB table it persists to.

  Deliberately a single always-warm instance rather than Lambda. Lambda
  recycles idle containers on its own schedule, so an unpredictable
  multi-second cold start lands on an arbitrary request, which is the one
  failure mode a latency-focused cache cannot absorb. Keeping a Lambda warm
  also costs more than this instance does. Reasoning: knowledge/learned.md
  section 23.

  Everything here is stop/start friendly: stop the instance and only the
  EBS volume keeps billing, roughly $1.60/month.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair, for SSH access to the instance.

  MyIp:
    Type: String
    Description: >
      Your public IP in CIDR form (e.g. 203.0.113.4/32) so SSH is reachable
      only from you. Find it with `curl -s https://checkip.amazonaws.com`.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

  InstanceType:
    Type: String
    Default: m7i-flex.large
    # Restricted to free-tier-eligible types on purpose: accounts on the
    # AWS Free Tier plan are only permitted to launch these, and anything
    # else fails at create time with "not eligible for Free Tier". Query
    # the current list with:
    #   aws ec2 describe-instance-types \
    #     --filters Name=free-tier-eligible,Values=true
    AllowedValues: [t3.small, c7i-flex.large, m7i-flex.large]
    Description: >
      m7i-flex.large (8 GB) by default. The embedding model's weights
      (~420 MB), torch's runtime, and the in-RAM graph all share this box,
      and installing torch alone can spike past 2 GB, so t3.small is tight
      enough to be a real risk. At demo-level usage the difference is
      cents: about $1.92/month for 8 GB against $0.42 for 2 GB, if the
      instance is stopped when idle.

  StopHour:
    Type: String
    Default: "0 3"
    Description: >
      Minute and hour (America/New_York) for the nightly auto-stop, as the
      first two fields of a cron expression. Default "0 3" is 3am, chosen
      because nobody demos then, so the schedule can never interrupt a
      session in progress.

  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >
      Resolved at deploy time from SSM rather than hardcoded, so the stack
      does not pin a stale AMI id. Must match the architecture of the
      instance type above: every free-tier-eligible option listed there is
      x86_64. Switching to a Graviton type (t4g.*) means switching this to
      the arm64 path as well, or the instance will fail to boot.

Resources:
  CacheTable:
    Type: AWS::DynamoDB::Table
    # It is a cache: every entry is reconstructible by re-asking the LLM.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # On-demand, never provisioned. Provisioned capacity bills around the
      # clock whether or not anything reads the table.
      BillingMode: PAY_PER_REQUEST

  # The instance authenticates as this role. No access keys are ever copied
  # onto the box: EC2 hands short-lived, auto-rotating credentials to the
  # SDK through the instance metadata service, and boto3 picks them up with
  # no configuration. A leaked long-lived key is the single most common way
  # a hobby AWS account gets compromised, and this avoids having one.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Enables browser-based shell access without opening SSH at all.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: cache-table-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Scan
                Resource: !GetAtt CacheTable.Arn
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                # Anthropic models only, not bedrock:* on everything. Left
                # at the anthropic/* prefix rather than one exact ARN
                # because the Messages endpoint may resolve a model id to
                # either a foundation model or an inference profile, and
                # pinning the wrong one fails closed at runtime.
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/anthropic.*
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*.anthropic.*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Semantic cache API and SSH
      SecurityGroupIngress:
        # SSH restricted to one address, never 0.0.0.0/0.
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIp
          Description: SSH from my IP only
        # The API is intentionally open so a demo can be shared. It serves
        # a stubbed or Bedrock-backed answer and stores nothing sensitive.
        # Narrow this to MyIp too if the demo never needs to be public.
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0
          Description: Cache API

  CacheInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmi
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            # Holds the venv, torch, the model weights, and the graph
            # snapshot. Survives stop/start, which is what makes restarting
            # fast instead of a full rebuild.
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: semantic-cache
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          dnf update -y
          dnf install -y python3.11 python3.11-pip git gcc
          mkdir -p /var/lib/semantic-cache
          chown ec2-user:ec2-user /var/lib/semantic-cache
          cat >/etc/profile.d/semantic-cache.sh <<EOF
          export CACHE_TABLE_NAME=${CacheTable}
          export AWS_DEFAULT_REGION=${AWS::Region}
          EOF

  # Deterministic nightly auto-stop. This is the guard that actually works:
  # the realistic failure is forgetting the instance is running, not a
  # runaway workload, and a fixed daily stop caps a forgotten instance at
  # under 24 hours (~$2.40) no matter what.
  #
  # Chosen over a CPU-idle alarm on purpose. One embedding request uses
  # roughly a CPU-second, so even active demoing averages well under 5% CPU
  # on 2 vCPUs -- an idle-detection alarm would either fire mid-demo or
  # never fire at all. A wall-clock schedule has no such ambiguity.
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: stop-cache-instance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Stop only. It can never start the instance, so the schedule
              # cannot cost money, only save it.
              - Effect: Allow
                Action: ec2:StopInstances
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${CacheInstance}

  # AWS Budgets assumes this to stop the instance when spend crosses the
  # limit. Separate from SchedulerRole because a different service principal
  # assumes it; same deliberate restriction to stop-only on this one
  # instance, so neither guard can ever start anything.
  BudgetActionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: budgets.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: stop-cache-instance-on-budget
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:StopInstances
                  - ec2:DescribeInstanceStatus
                Resource: "*"

  NightlyStop:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Stop the cache instance nightly so a forgotten one cannot run for days
      ScheduleExpression: !Sub cron(${StopHour} * * ? *)
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ec2:stopInstances
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"InstanceIds": ["${CacheInstance}"]}'

Outputs:
  # Only stable attributes belong here. An earlier version also output
  # PublicIp and a derived ApiUrl, which broke every stack update performed
  # while the instance was stopped: a stopped instance has no public IP, so
  # !GetAtt CacheInstance.PublicIp fails to resolve and rolls back the whole
  # update. They were misleading anyway, since the IP changes on every start,
  # so an output holding one is stale the moment you restart. Read the
  # current IP from the instance instead:
  #   aws ec2 describe-instances --instance-ids <id> \
  #     --query 'Reservations[0].Instances[0].PublicIpAddress' --output text
  InstanceId:
    Description: Use with `aws ec2 start-instances` / `stop-instances`
    Value: !Ref CacheInstance

  CacheTableName:
    Description: Set as CACHE_TABLE_NAME on the instance
    Value: !Ref CacheTable

  BudgetActionRoleArn:
    Description: Pass to `aws budgets create-budget-action --execution-role-arn`
    Value: !GetAtt BudgetActionRole.Arn
