AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Semantic caching layer for LLM APIs. An HTTP API in front of a Lambda
  that embeds each query, searches a from-scratch HNSW index, and either
  serves a cached response or calls Claude on Bedrock and caches the
  result.

  Fully serverless and pay-per-request on purpose (knowledge/learned.md
  section 16): nothing here bills while idle. OpenSearch Serverless was
  ruled out for its idle OCU floor, and provisioned concurrency for its
  standing 24/7 cost -- the HNSW graph is rebuilt from DynamoDB on cold
  start instead (section 19).

Parameters:
  OperatingThreshold:
    Type: String
    Default: "0.80"
    Description: >
      Cosine similarity at or above which a query is served from cache.
      Model-specific: this must be the value derived by running the
      threshold sweep against the SAME embedding model configured below,
      not the 0.80 derived locally on all-mpnet-base-v2.

  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0

  LlmModelId:
    Type: String
    Default: anthropic.claude-haiku-4-5

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 1024
    # Generous because a cold start rebuilds the whole graph before it can
    # answer: ~16.5s at 10,000 entries (section 19). Warm requests return
    # in milliseconds; this ceiling only ever applies to the first one.
    Timeout: 60

Resources:
  # A full DynamoDB::Table rather than SAM's SimpleTable purely so
  # BillingMode is stated outright. SimpleTable would default to the same
  # on-demand billing, but this is the load-bearing cost decision in the
  # whole stack and it should be visible, not inherited from a default.
  CacheTable:
    Type: AWS::DynamoDB::Table
    # It's a cache: everything in it is reconstructible by re-asking the
    # LLM. Letting `sam delete` take the table with it keeps teardown
    # complete, which matters more here than retaining warm entries.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # On-demand, not provisioned. Provisioned capacity bills around the
      # clock whether or not anything reads the table, which is the same
      # objection that ruled out OpenSearch Serverless (section 16).
      BillingMode: PAY_PER_REQUEST

  CacheFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: lambda_handler.handler
      Environment:
        Variables:
          CACHE_TABLE_NAME: !Ref CacheTable
          OPERATING_THRESHOLD: !Ref OperatingThreshold
          EMBEDDING_MODEL_ID: !Ref EmbeddingModelId
          LLM_MODEL_ID: !Ref LlmModelId
      Policies:
        # Scoped to this one table rather than a managed policy granting
        # the whole account's DynamoDB.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Scan
              Resource: !GetAtt CacheTable.Arn
        # The embedding model is pinned to exactly the one configured
        # above. The generative side is left at the anthropic/* prefix
        # rather than a single ARN: the Messages-API endpoint may resolve
        # a model id to either a foundation model or a cross-region
        # inference profile, and pinning the wrong one of those two fails
        # closed at runtime. Narrow it to the exact ARN once a deploy has
        # shown which form actually gets invoked.
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/anthropic.*
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*.anthropic.*
      Events:
        Query:
          Type: HttpApi
          Properties:
            Path: /query
            Method: POST

Outputs:
  ApiUrl:
    Description: 'POST a JSON body of {"query": "..."} here'
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/query

  CacheTableName:
    Description: DynamoDB table holding cached responses and their vectors
    Value: !Ref CacheTable

  FunctionName:
    Description: Lambda function name, for tailing logs with `sam logs`
    Value: !Ref CacheFunction
